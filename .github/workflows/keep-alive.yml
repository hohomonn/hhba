name: Supabase 깨어있게 하기

# 무료 플랜은 7일 동안 요청이 없으면 프로젝트를 멈춥니다.
# 월요일과 목요일에 한 번씩 가볍게 찔러서 타이머를 초기화합니다.
on:
  schedule:
    - cron: '0 3 * * 1,4'     # UTC 기준. 한국 시간으로는 월/목 낮 12시
  workflow_dispatch:           # 필요할 때 손으로도 돌릴 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 찌르기
        run: |
          URL="https://wbmdmrxxcrxbevxodrel.supabase.co/rest/v1/places?select=id&limit=1"
          KEY="sb_publishable_3Ijq0C70pIa8Et_LS3562g_HHe4bJs-"

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL")

          echo "응답 코드: $CODE"

          # 200 = 정상. 데이터가 안 보이는 건 정상입니다.
          # 잠금(RLS) 덕분에 로그인 안 한 요청에는 빈 목록만 돌아와요.
          if [ "$CODE" = "200" ]; then
            echo "깨어있습니다."
          elif [ "$CODE" = "540" ]; then
            echo "이미 멈춰 있습니다. 대시보드에서 되살려주세요."
            exit 1
          else
            echo "예상 못 한 응답입니다. 확인이 필요해요."
            exit 1
          fi
